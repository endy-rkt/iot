apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-deployment
  labels:
    app: app3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
      - name: app3-container
        image: nginx:1.30-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: app3-site-file
          mountPath: /usr/share/nginx/html
          readOnly: true 
      volumes:
      - name: app3-site-file
        configMap:
          name: app3-index
