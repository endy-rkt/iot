apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-deployment
  labels:
    app: app2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
      - name: app2-container
        image: nginx:1.30-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: app2-site-file
          mountPath: /usr/share/nginx/html
          readOnly: true
      volumes:
      - name: app2-site-file
        configMap:
          name: app2-index
