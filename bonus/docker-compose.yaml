services:
  gitlab:
    image: 'gitlab/gitlab-ce:latest'
    restart: always
    hostname: 'localhost'
    container_name: gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://localhost:9090'
        puma['worker_processes'] = 1
        sidekiq['max_concurrency'] = 5
    ports:
      - '9090:9090'
      - '8443:443'
      - '2222:22'
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: '256m'

volumes:
  gitlab_config:
    driver: local
    driver_opts:
      type: none
      device: /home/trazanad/data/config
      o: bind
  gitlab_logs:
    driver: local
    driver_opts:
      type: none
      device: /home/trazanad/data/logs
      o: bind
  gitlab_data:
    driver: local
    driver_opts:
      type: none
      device: /home/trazanad/data/data
      o: bind