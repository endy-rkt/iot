apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitlab-pv-data
  namespace: gitlab
  labels:
    name: pv-data
spec:
  capacity:
    storage: 15Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /media/sf_iot_volumes/data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitlab-pv-logs
  namespace: gitlab
  labels:
    name: pv-logs
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /media/sf_iot_volumes/logs
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitlab-pv-config
  namespace: gitlab
  labels:
    name: pv-config
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /media/sf_iot_volumes/config
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-data
  namespace: gitlab
spec:
  selector:
    matchLabels:
      name: pv-data
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 15Gi
  storageClassName: manual
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-logs
  namespace: gitlab
spec:
  selector:
    matchLabels:
      name: pv-logs
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: manual
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-config
  namespace: gitlab
spec:
  selector:
    matchLabels:
      name: pv-config
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: manual
