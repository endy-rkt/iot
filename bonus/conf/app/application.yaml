apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitlab-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitlab-service.gitlab.svc.cluster.local:9090/gituser/gitops.git
    targetRevision: main
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    