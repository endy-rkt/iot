apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p3-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/endy-rkt/trazanad-gitops-wrwrwfs
    targetRevision: main
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    
